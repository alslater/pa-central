[project]
name = "pa-central-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "cryptography>=42.0.0",
    "redis>=8.0.0",
    "croniter>=2.0.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.18",
    "alembic>=1.13.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.2.0",
    # Reads .env directly in config.py to detect a legacy DATABASE_URL that
    # pydantic-settings' own env_file loading would otherwise never surface to
    # os.environ. Previously only a transitive dependency of pydantic-settings.
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "httpx>=0.27.0",
    # >=2.9.8: db_config.py passes sslrootcert="system" for verify-ca/
    # verify-full by default, a libpq 16+ feature. psycopg2-binary bundles
    # its own libpq rather than the OS one, and 2.9.0 bundled libpq 13.3 —
    # libpq wasn't bumped to 16 in the wheel until 2.9.8. Below that floor,
    # sslrootcert=system is rejected as an unrecognized connection parameter.
    "psycopg2-binary>=2.9.8",
    "asyncpg>=0.31.0",
    "pyotp>=2.9.0",
    "package-alert==0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "anyio>=4.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "boto3>=1.34.0",
    "aiosmtpd>=1.4.0",
    "freezegun>=1.5.0",
    "docker>=7.0.0",
    # Parses `docker compose config`'s rendered output in test_docker_compose.py.
    # Previously only a transitive dependency (via docker/boto3).
    "pyyaml>=6.0.0",
    # PEP 440 version comparison in test_db_config.py's psycopg2-binary floor
    # check — naive tuple/string comparison mishandles pre-release suffixes
    # and other PEP 440 forms. Available transitively via pytest, but
    # declared here because the test imports it directly.
    "packaging>=22",
]

[tool.ruff.lint]
# B008: flags Depends(...) and Query(...) used as default argument values.
# FastAPI's DI system intercepts these before they're evaluated as normal
# defaults, so the usual "shared mutable default" risk doesn't apply here.
# Every FastAPI codebase triggers this; it's a false positive for this pattern.
ignore = ["B008"]

[tool.uv]
package = false
required-version = ">=0.11.18"
