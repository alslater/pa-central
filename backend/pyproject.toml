[project]
name = "pa-central-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "cryptography>=42.0.0",
    "redis>=8.0.0",
    "croniter>=2.0.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "httpx>=0.27.0",
    # psycopg2 (sync) is what Alembic uses — env.py rewrites the async URL to
    # postgresql+psycopg2. asyncpg is what the app runtime needs, since
    # database.py builds an async engine and psycopg2 cannot drive one.
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.30.0",
    "pyotp>=2.9.0",
    "package-alert==0.6.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "anyio>=4.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "boto3>=1.34.0",
    "aiosmtpd>=1.4.0",
    "freezegun>=1.5.0",
    "docker>=7.0.0",
]

[tool.ruff.lint]
# B008: flags Depends(...) and Query(...) used as default argument values.
# FastAPI's DI system intercepts these before they're evaluated as normal
# defaults, so the usual "shared mutable default" risk doesn't apply here.
# Every FastAPI codebase triggers this; it's a false positive for this pattern.
ignore = ["B008"]

[tool.uv]
package = false
required-version = ">=0.11.18"
